name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: output
          filename: github-metrics.svg
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_colors: "0:#75aadb, 1:#1e3a8a, 2:#cfe3f5, 3:#2563eb, 4:#ffffff, 5:#9ec5e8, 6:#3b82f6, 7:#e0f2fe"
