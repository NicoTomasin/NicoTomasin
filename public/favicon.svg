<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Glow effect -->
    <filter id="crtGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Scanlines pattern -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="128" height="4">
      <line x1="0" y1="0" x2="128" y2="0" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
    </pattern>
    
    <!-- CRT screen gradient -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1a12"/>
      <stop offset="100%" stop-color="#050a08"/>
    </radialGradient>
    
    <!-- Vignette effect -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
  </defs>
  
  <!-- CRT Monitor frame -->
  <rect x="4" y="4" width="120" height="120" rx="12" ry="12" fill="#1a1a1a"/>
  
  <!-- Screen background -->
  <rect x="10" y="10" width="108" height="108" rx="8" ry="8" fill="url(#screenGlow)"/>
  
  <!-- The "N" letter with CRT glow -->
  <g filter="url(#crtGlow)">
    <!-- Main N - phosphor green -->
    <text x="64" y="98" 
          font-family="'Courier New', monospace" 
          font-size="95" 
          font-weight="bold" 
          fill="#00ff66" 
          text-anchor="middle"
          opacity="0.95">N</text>
    
    <!-- Chromatic aberration - red offset -->
    <text x="62" y="98" 
          font-family="'Courier New', monospace" 
          font-size="95" 
          font-weight="bold" 
          fill="#ff0044" 
          text-anchor="middle"
          opacity="0.15">N</text>
    
    <!-- Chromatic aberration - blue offset -->
    <text x="66" y="98" 
          font-family="'Courier New', monospace" 
          font-size="95" 
          font-weight="bold" 
          fill="#0088ff" 
          text-anchor="middle"
          opacity="0.15">N</text>
  </g>
  
  <!-- Scanlines overlay -->
  <rect x="10" y="10" width="108" height="108" rx="8" ry="8" fill="url(#scanlines)"/>
  
  <!-- Vignette overlay -->
  <rect x="10" y="10" width="108" height="108" rx="8" ry="8" fill="url(#vignette)"/>
  
  <!-- Screen reflection/glare -->
  <ellipse cx="40" cy="35" rx="25" ry="15" fill="rgba(255,255,255,0.03)"/>
</svg>
